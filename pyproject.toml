[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accessatlas"
version = "0.1.0"
description = "Cross-platform identity risk detection system"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
    "pandera>=0.18",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "rapidfuzz>=3.6",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["accessatlas*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]   # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["accessatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
