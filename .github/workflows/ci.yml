name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check accessatlas/ tests/ scripts/
          ruff format --check accessatlas/ tests/ scripts/

      - name: Run tests
        # Tests use tests/fixtures/ (committed to git) — no full data needed.
        run: pytest tests/ -v --tb=short
