paths:
  raw: data/raw
  processed: data/processed
  fixtures: tests/fixtures
logging:
  level: INFO
  format: '%(asctime)s %(name)-20s %(levelname)-8s %(message)s'
ingestion:
  core_file: AccessAtlas_Dataset_Core.xlsx
  events_files:
  - AccessAtlas_Dataset_Events_Part1.xlsx
  - AccessAtlas_Dataset_Events_Part2.xlsx
  fixture_sample_size: 200
resolution:
  fuzzy_threshold: 70.0
  ambiguity_margin: 3.0
privilege:
  # Fallback Okta admin role-to-tier mapping if Tier_Mapping is absent
  okta_roles:
    SUPER_ADMIN: 0
    ORG_ADMIN: 1
    APP_ADMIN: 2
    HELP_DESK_ADMIN: 2
    READ_ONLY_ADMIN: 3
snapshot_date: "2026-10-12"
rules:
  # Inactivity threshold for privileged identities (tier <= 1)
  dormant_admin_days: 60
  # API token rotation and usage limits
  token_rotation_days: 365
  token_inactivity_days: 90
  # Context suppression thresholds
  new_hire_days: 30
  recent_role_change_days: 30
ml:
  # Unsupervised behavioural anomaly alert budget (percentage of identities)
  # Calibrated on train: 2.0% alert budget yields 65 alerts total (~1-2/day for analyst review)
  # with 0.00% false alarms on NORMAL identities (0/2,924) and 28.48% on TRAP identities (43/151).
  alert_budget_percentile: 2.0
  random_state: 42
  n_estimators: 100
llm:
  enabled: true
  base_url: http://localhost:11434
  model: llama3.2:latest
  timeout_seconds: 60
  max_input_chars: 1200


