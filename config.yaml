paths:
  raw: data/raw
  processed: data/processed
  fixtures: tests/fixtures
logging:
  level: INFO
  format: '%(asctime)s %(name)-20s %(levelname)-8s %(message)s'
ingestion:
  core_file: AccessAtlas_Dataset_Core.xlsx
  events_files:
  - AccessAtlas_Dataset_Events_Part1.xlsx
  - AccessAtlas_Dataset_Events_Part2.xlsx
  fixture_sample_size: 200
resolution:
  fuzzy_threshold: 70.0
privilege:
  # Fallback Okta admin role-to-tier mapping if Tier_Mapping is absent
  okta_roles:
    SUPER_ADMIN: 0
    ORG_ADMIN: 1
    APP_ADMIN: 2
    HELP_DESK_ADMIN: 2
    READ_ONLY_ADMIN: 3
